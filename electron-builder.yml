appId: app.tome.reader
productName: Tome
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
# Steam library artwork, copied onto the Steam shortcut (src/platform/steamArt.ts).
extraResources:
  - from: resources/steam
    to: steam
linux:
  icon: resources/steam/icon.png
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  artifactName: Tome-x86_64.AppImage
  executableArgs: ["--fullscreen"]
mac:
  target: dir
  category: public.app-category.books
