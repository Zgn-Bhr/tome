appId: app.tome.reader
productName: Tome
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office
  artifactName: Tome-${version}-x86_64.AppImage
  executableArgs: ["--fullscreen"]
mac:
  target: dir
  category: public.app-category.books
